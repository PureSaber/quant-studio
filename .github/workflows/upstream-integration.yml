name: Upstream integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        upstream:
          - {repo: quant-paper-sim, ref: e414264a01f8c90f218e0c544d422e88db8051c6, test: paper}
          - {repo: quant-hk-equity, ref: 18cfe93a757e93e0c89875ceff9612350f989359, test: hk}
          - {repo: a-share-multifactor, ref: 6b799c3e4c2871153e399a62ba0b5e1e6c68fc99, test: ashare}
          - {repo: quant-pipeline, ref: b1fce90b85651248e9e60ae857b88fe4d170319e, test: account}
          - {repo: quant-fund, ref: 52042caff6fc60aa6a4b5273946ab2093ba1de5d, test: fund}
          - {repo: quant-futures-spread, ref: 314b889455166c39611285ddd72aa73ee451ec34, test: futures}
          - {repo: quant-crypto-basis, ref: 3b0e68aefe2a013b9c8f8e15b47078cf19c55b54, test: crypto}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: quant-studio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PureSaber/${{ matrix.upstream.repo }}
          ref: ${{ matrix.upstream.ref }}
          path: ${{ matrix.upstream.repo }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install frozen upstream dependencies
        working-directory: ${{ matrix.upstream.repo }}
        shell: bash
        run: |
          if [ -f stack.lock ]; then
            python -m pip install -r requirements.lock
            python -m pip install --no-deps -r stack.lock
          else
            python -m pip install --no-deps -r requirements.lock
          fi
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Studio and verify dependency closure
        run: |
          python -m pip install --no-deps --no-build-isolation -e quant-studio
          python -m pip check
      - name: Exercise actual upstream output and CLI contracts
        env:
          QUANT_UPSTREAM_REPO: ${{ github.workspace }}/${{ matrix.upstream.repo }}
        run: python -m pytest quant-studio/integration -k ${{ matrix.upstream.test }} -q
      - name: Exercise real batch dispatch and resource accounting
        if: matrix.upstream.test == 'crypto'
        shell: bash
        env:
          QUANT_TEST_BATCH_SOURCE: ${{ github.workspace }}/quant-crypto-basis
        run: |
          export QUANT_TEST_BATCH_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          python -m pytest quant-studio/tests/test_batch_runtime.py -q
  timing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: quant-studio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PureSaber/quant-timing
          ref: 35058df73d079f951b5600154ee444ce66fe5fa6
          path: quant-timing
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native timing and Studio
        run: |
          python -m pip install -e "quant-timing[dev]"
          python -m pip install --no-deps -e quant-studio
          python -m pip check
      - name: Verify timing publication and evidence contracts
        env:
          QUANT_UPSTREAM_REPO: ${{ github.workspace }}/quant-timing
        run: python -m pytest quant-studio/integration/test_timing_upstream.py quant-studio/integration/test_timing_counterfactual.py -q
  upstream-integration:
    name: upstream-integration
    needs: [integration, timing]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every upstream matrix to succeed
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          TIMING_RESULT: ${{ needs.timing.result }}
        run: |
          test "$INTEGRATION_RESULT" = success
          test "$TIMING_RESULT" = success
