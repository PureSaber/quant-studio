name: Upstream integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        upstream:
          - {repo: quant-paper-sim, ref: 0ff46a10f21c5df64a6cd77b7e941a506240dffe, test: paper}
          - {repo: quant-hk-equity, ref: 37a9314e63038b8a89afcbbec2f5936953c0c62b, test: hk}
          - {repo: a-share-multifactor, ref: e54eb73bc4f8369759edf38a15a4b0dfa82f6895, test: ashare}
          - {repo: quant-pipeline, ref: b1fce90b85651248e9e60ae857b88fe4d170319e, test: account}
          - {repo: quant-fund, ref: c7be45bdce66aee49762430ba93d2fc361e3c4b5, test: fund}
          - {repo: quant-futures-spread, ref: f01d6afd87ca0556d6e2f44e522cfecbf00cad56, test: futures}
          - {repo: quant-crypto-basis, ref: 02acfeb6227d8f61243b908846592af4e5b70365, test: crypto}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: quant-studio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PureSaber/${{ matrix.upstream.repo }}
          ref: ${{ matrix.upstream.ref }}
          path: ${{ matrix.upstream.repo }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install frozen upstream dependencies
        working-directory: ${{ matrix.upstream.repo }}
        shell: bash
        run: |
          if [ -f stack.lock ]; then
            python -m pip install -r requirements.lock
            python -m pip install --no-deps -r stack.lock
          else
            python -m pip install --no-deps -r requirements.lock
          fi
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Studio and verify dependency closure
        run: |
          python -m pip install --no-deps --no-build-isolation -e quant-studio
          python -m pip check
      - name: Exercise actual upstream output and CLI contracts
        env:
          QUANT_UPSTREAM_REPO: ${{ github.workspace }}/${{ matrix.upstream.repo }}
        run: python -m pytest quant-studio/integration -k ${{ matrix.upstream.test }} -q
  timing:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: quant-studio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PureSaber/quant-timing
          ref: 35058df73d079f951b5600154ee444ce66fe5fa6
          path: quant-timing
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native timing and Studio
        run: |
          python -m pip install -e "quant-timing[dev]"
          python -m pip install --no-deps -e quant-studio
          python -m pip check
      - name: Verify timing publication and evidence contracts
        env:
          QUANT_UPSTREAM_REPO: ${{ github.workspace }}/quant-timing
        run: python -m pytest quant-studio/integration/test_timing_upstream.py quant-studio/integration/test_timing_counterfactual.py -q
