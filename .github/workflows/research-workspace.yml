name: Research workspace integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-workspace:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: quant-studio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PureSaber/quant-agent
          ref: 636229bd9c17410b734c5b5827241ecb5dd87a9a
          path: quant-agent
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PureSaber/quant-data-kit
          ref: 912d81c6a13663012eee948f0001724153c1ae1b
          path: quant-data-kit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PureSaber/quant-workspace
          ref: 0695cce48f1aa74aea3180cd6d3c005cb6a468c1
          path: quant-workspace
          persist-credentials: false
      - name: Install Studio and four independent locked runtimes
        shell: pwsh
        run: |
          python -m pip install --no-deps -r quant-studio/requirements.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e quant-studio
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv notebook-env
          ./notebook-env/Scripts/python -m pip install --no-deps -r quant-studio/optional/notebook-windows-py312.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./notebook-env/Scripts/python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv agent-env
          ./agent-env/Scripts/python -m pip install --no-deps -r quant-agent/requirements.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./agent-env/Scripts/python -m pip install --no-deps --no-build-isolation -e quant-agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./agent-env/Scripts/python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv qdk-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./qdk-env/Scripts/python -m pip install --no-deps -r quant-data-kit/requirements.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./qdk-env/Scripts/python -m pip install --no-deps --no-build-isolation -e quant-data-kit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./qdk-env/Scripts/python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m venv workspace-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./workspace-env/Scripts/python -m pip install --no-deps -r quant-workspace/requirements.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./workspace-env/Scripts/python -m pip install --no-deps --no-build-isolation -e quant-workspace
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./workspace-env/Scripts/python -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise real Lab, data admission, frozen reads and agent subprocess
        working-directory: quant-studio
        env:
          PYTHONUTF8: '1'
          QUANT_TEST_NOTEBOOK_PYTHON: ${{ github.workspace }}/notebook-env/Scripts/python.exe
          QUANT_TEST_AGENT_SOURCE: ${{ github.workspace }}/quant-agent
          QUANT_TEST_AGENT_PYTHON: ${{ github.workspace }}/agent-env/Scripts/python.exe
          QUANT_TEST_RESEARCH_AGENT_PYTHON: ${{ github.workspace }}/agent-env/Scripts/python.exe
          QUANT_TEST_INTAKE_SOURCE: ${{ github.workspace }}/quant-data-kit
          QUANT_TEST_INTAKE_IMPORT_PYTHON: ${{ github.workspace }}/qdk-env/Scripts/python.exe
          QUANT_TEST_INTAKE_PYTHON: ${{ github.workspace }}/notebook-env/Scripts/python.exe
          QUANT_TEST_WORKSPACE_SOURCE: ${{ github.workspace }}/quant-workspace
          QUANT_TEST_WORKSPACE_PYTHON: ${{ github.workspace }}/workspace-env/Scripts/python.exe
          QUANT_TEST_PLATFORM_WORKSPACE_PYTHON: ${{ github.workspace }}/workspace-env/Scripts/python.exe
        run: python -m pytest tests/test_research_workspace_integration.py tests/test_notebook_research.py tests/test_project_lifecycle.py tests/test_project_evidence.py tests/test_platform_status_web.py tests/test_notebook_intake.py tests/test_notebook_template_http.py tests/test_intake_http.py tests/test_operations_jobs.py tests/test_notebook_templates.py tests/test_notebook_metrics.py tests/test_notebook_template_workflow.py tests/test_notebook_batches.py tests/test_data_maintenance.py tests/test_research_sdk.py tests/test_workbench_next.py tests/test_next_native_integration.py -q
