name: isolated Notebook execution
on:
  pull_request:
  push:
    branches: [codex/research-isolation-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --no-deps -r requirements.lock
          python -m pip install --no-deps -r optional/isolation.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Build trusted test-only Notebook image and record exact identity
        run: |
          docker build -f optional/isolation.Dockerfile -t quant-notebook-test .
          echo "QUANT_NOTEBOOK_IMAGE=$(docker image inspect --format '{{.Id}}' quant-notebook-test)" >> "$GITHUB_ENV"
          docker image inspect quant-notebook-test > image-identity.json
          docker run --rm --network none quant-notebook-test python -m pip freeze > image-packages.txt
      - name: Execute actual Notebook runner, failure and JobManager cancellation
        run: python -m pytest -v tests/test_notebook_isolation.py --basetemp=notebook-evidence --junitxml=notebook-isolation.xml
      - name: Check whole-container cleanup
        if: always()
        run: test -z "$(docker ps -aq --filter label=quant.research-isolation=v1)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: notebook-containment-evidence
          path: |
            image-identity.json
            image-packages.txt
            notebook-isolation.xml
            notebook-evidence/**/isolation.json
            notebook-evidence/**/run.json
            notebook-evidence/**/environment.json
            notebook-evidence/**/execution.log
